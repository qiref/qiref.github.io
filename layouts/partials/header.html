<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}" />
    <link rel="stylesheet" href="{{ "css/fonts.css" | relURL }}" />
    {{ partial "head_custom.html" . }}
  </head>

  <body>
    <nav>
    <ul class="menu">
      {{ range .Site.Menus.main }}
      <li><a href="{{ .URL | relURL }}">{{ .Name }}</a></li>
      {{ end }}
      <li class="search-container">
        <button type="button" id="search-trigger" class="search-trigger" aria-label="搜索文章 (⌘K)" title="搜索 (⌘K)">
          <svg class="search-trigger-icon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
            <path fill="currentColor" d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"></path>
          </svg>
          <span class="search-trigger-kbd">⌘K</span>
        </button>
      </li>
    </ul>
    <hr/>
    </nav>

    <div id="search-modal" class="search-modal" aria-hidden="true">
      <div class="search-backdrop" id="search-backdrop"></div>
      <div class="search-dialog" role="dialog" aria-modal="true" aria-label="站内搜索">
        <div class="search-header">
          <svg class="search-input-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <path fill="currentColor" d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"></path>
          </svg>
          <input type="text" id="search-input" placeholder="搜索文章标题或内容..." autocomplete="off" spellcheck="false">
          <button type="button" id="search-clear" class="search-clear" aria-label="清空输入" hidden>&times;</button>
          <kbd class="search-esc" id="search-esc-btn" title="关闭 (ESC)">ESC</kbd>
        </div>
        <div id="search-results" class="search-body"></div>
        <div class="search-footer">
          <div class="search-hints">
            <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
            <span><kbd>↵</kbd> 打开</span>
            <span><kbd>ESC</kbd> 关闭</span>
          </div>
          <div id="search-count" class="search-count"></div>
        </div>
      </div>
    </div>
